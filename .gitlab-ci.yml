# GitLab Pages deploy — serves the benchmark landing page.
# Runs only on the gh-pages branch; publishes public/ as the site.
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp index.html public/index.html
  artifacts:
    paths:
      - public
    expire_in: never
  rules:
    - if: $CI_COMMIT_BRANCH == "gh-pages"

name: Publish npm (@librebase/*)

# npm provenance (OIDC) — link each package to this repo/workflow on npmjs.com before first run.
# Tag example: npm-v0.1.30 — package.json versions should match the tag suffix.

on:
  push:
    tags:
      - "npm-v*"

permissions:
  id-token: write
  contents: read

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          VER="${TAG#npm-v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Publishing npm packages at version ${VER}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish packages whose version matches the tag
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for pkg in packages/mcp packages/cli packages/sdk; do
            pkg_ver="$(node -p "require('./${pkg}/package.json').version")"
            name="$(node -p "require('./${pkg}/package.json').name")"
            if [ "$pkg_ver" = "$RELEASE_VERSION" ]; then
              echo "Publishing ${name}@${pkg_ver}"
              (cd "$pkg" && npm publish --provenance --access public)
            else
              echo "Skip ${name}@${pkg_ver} (tag is npm-v${RELEASE_VERSION})"
            fi
          done

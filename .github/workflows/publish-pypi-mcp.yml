name: Publish PyPI (librebase-mcp)

# Trusted publishing (OIDC) — configure on PyPI before first run:
#   Owner: librebase-official, repo: librebase, workflow: publish-pypi-mcp.yml, environment: pypi
# Tag example: mcp-py-v0.1.30 (version must match VERSION / wheel metadata)

on:
  push:
    tags:
      - "mcp-py-v*"

permissions:
  id-token: write
  contents: read

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build mcp
          twine check mcp/dist/*

      - name: Publish to PyPI (trusted publisher OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp/dist/

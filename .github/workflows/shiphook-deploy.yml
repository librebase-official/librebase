name: Deploy via Shiphook

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: true
        default: "main"
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shiphook-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Shiphook
        env:
          SHIPHOOK_URL: ${{ secrets.SHIPHOOK_DEPLOY_URL }}
          SHIPHOOK_SECRET: ${{ secrets.SHIPHOOK_DEPLOY_TOKEN }}
          DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$SHIPHOOK_URL" || { echo "Missing SHIPHOOK_DEPLOY_URL" >&2; exit 1; }
          test -n "$SHIPHOOK_SECRET" || { echo "Missing SHIPHOOK_DEPLOY_TOKEN" >&2; exit 1; }
          curl --fail-with-body --silent --show-error --location \
            --max-time 30 \
            -X POST "${SHIPHOOK_URL}?format=json" \
            -H "X-Shiphook-Secret: $SHIPHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg ref \"$DEPLOY_REF\" --arg repository \"$GITHUB_REPOSITORY\" \
              '{ref: $ref, repository: $repository, event: "github_actions"}')"

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## Shiphook deployment"
            echo "- Repository: \\`$GITHUB_REPOSITORY\\`"
            echo "- Commit: \\`$GITHUB_SHA\\`"
            echo "- Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

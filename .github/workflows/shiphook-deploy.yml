name: Deploy via Shiphook

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: true
        default: "main"
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shiphook-production
  cancel-in-progress: false

env:
  SHIPHOOK_URL: ${{ secrets.SHIPHOOK_DEPLOY_URL }}
  SHIPHOOK_TOKEN: ${{ secrets.SHIPHOOK_DEPLOY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Shiphook configuration
        env:
          DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          test -n "$SHIPHOOK_URL" || { echo "Missing SHIPHOOK_DEPLOY_URL" >&2; exit 1; }
          test -n "$SHIPHOOK_TOKEN" || { echo "Missing SHIPHOOK_DEPLOY_TOKEN" >&2; exit 1; }
          echo "Deploying ref $DEPLOY_REF"

      - name: Trigger Shiphook deployment
        id: deploy
        env:
          DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --location \
            --retry 2 --retry-delay 2 --max-time 30 \
            -X POST "$SHIPHOOK_URL" \
            -H "Authorization: Bearer $SHIPHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg ref \"$DEPLOY_REF\" --arg sha \"$GITHUB_SHA\" \
              '{ref: $ref, commit: $sha, repository: env.GITHUB_REPOSITORY, event: "github_actions"}')")
          printf '%s' "$response" > "$RUNNER_TEMP/shiphook-response.json"
          deployment_url=$(jq -r '.deployment_url // .url // .deploy_url // empty' "$RUNNER_TEMP/shiphook-response.json")
          deployment_id=$(jq -r '.deployment_id // .id // empty' "$RUNNER_TEMP/shiphook-response.json")
          test -n "$deployment_url" || { echo "Shiphook response did not include a deployment URL" >&2; cat "$RUNNER_TEMP/shiphook-response.json"; exit 1; }
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Deployment started: $deployment_url"

      - name: Verify deployment health
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/health.json" \
              --write-out '%{http_code}' --max-time 10 "$DEPLOYMENT_URL/health" || true)
            if [ "$status" = 200 ]; then
              echo "Deployment healthy"
              cat "$RUNNER_TEMP/health.json"
              exit 0
            fi
            echo "Health check $attempt/30 returned HTTP $status"
            sleep 10
          done
          echo "Deployment did not become healthy: $DEPLOYMENT_URL/health" >&2
          exit 1

      - name: Publish deployment summary
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          {
            echo "## Shiphook deployment"
            echo "- Repository: \\`$GITHUB_REPOSITORY\\`"
            echo "- Commit: \\`$GITHUB_SHA\\`"
            echo "- Deployment: ${DEPLOYMENT_URL:-not returned}"
            echo "- Deployment ID: ${DEPLOYMENT_ID:-not returned}"
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy via Shiphook

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: true
        default: "main"
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shiphook-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Shiphook
        env:
          SHIPHOOK_URL: ${{ secrets.SHIPHOOK_DEPLOY_URL }}
          SHIPHOOK_SECRET: ${{ secrets.SHIPHOOK_DEPLOY_TOKEN }}
          DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${SHIPHOOK_URL:-}" ]; then
            echo "::error::SHIPHOOK_DEPLOY_URL is not configured. Add the Shiphook deploy URL repository secret before running production deploys."
            echo "Shiphook deploy skipped: SHIPHOOK_DEPLOY_URL secret is empty (Julian configures deploy secrets)." >&2
            exit 1
          fi
          if [ -z "${SHIPHOOK_SECRET:-}" ]; then
            echo "::error::SHIPHOOK_DEPLOY_TOKEN is not configured. Add the Shiphook deploy token repository secret before running production deploys."
            echo "Shiphook deploy skipped: SHIPHOOK_DEPLOY_TOKEN secret is empty (Julian configures deploy secrets)." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --location \
            --max-time 30 \
            -X POST "${SHIPHOOK_URL}?format=json" \
            -H "X-Shiphook-Secret: $SHIPHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg ref "$DEPLOY_REF" --arg repository "$GITHUB_REPOSITORY" \
              '{ref: $ref, repository: $repository, event: "github_actions"}')"

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## Shiphook deployment"
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

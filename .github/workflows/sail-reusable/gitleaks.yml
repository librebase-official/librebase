name: sail / gitleaks
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: sail / gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks v8.24.2 (binary, no licensed action)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          chmod +x gitleaks
          ./gitleaks version
      - name: Diff scan (PR)
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          ./gitleaks detect --source . --log-opts="${BASE}...HEAD" --redact --exit-code 1
      - name: Diff scan (push fallback)
        if: github.event_name != 'pull_request'
        run: ./gitleaks detect --source . --redact --exit-code 1

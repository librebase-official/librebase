name: sail / lint-typecheck
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for JS/TS repos
        required: false
        type: string
        default: "22"
      working-directory:
        description: Package root (use . for repo root)
        required: false
        type: string
        default: "."

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  lint-typecheck:
    name: sail / lint-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect stack
        id: stack
        run: |
          set -euo pipefail
          if [ -f package.json ]; then echo "kind=node" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then echo "kind=python" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f Cargo.toml ]; then echo "kind=rust" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f go.mod ]; then echo "kind=go" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "kind=none" >> "$GITHUB_OUTPUT"
      - name: Node lint + typecheck
        if: steps.stack.outputs.kind == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Node install
        if: steps.stack.outputs.kind == 'node'
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            curl -fsSL https://bun.sh/install | bash
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"
            bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Node typecheck
        if: steps.stack.outputs.kind == 'node'
        run: |
          if npm run | grep -q " typecheck"; then npm run typecheck; elif npm run | grep -q " lint"; then npm run lint; else npx --yes tsc -p . --noEmit 2>/dev/null || echo "No typecheck script; skipped"
      - name: Python ruff (if configured)
        if: steps.stack.outputs.kind == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python lint
        if: steps.stack.outputs.kind == 'python'
        run: |
          pip install ruff
          ruff check . || true
      - name: Rust fmt + clippy
        if: steps.stack.outputs.kind == 'rust'
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Go vet
        if: steps.stack.outputs.kind == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go vet run
        if: steps.stack.outputs.kind == 'go'
        run: go vet ./...
      - name: No-op for unsupported stacks
        if: steps.stack.outputs.kind == 'none'
        run: echo "No supported manifest; lint-typecheck skipped"

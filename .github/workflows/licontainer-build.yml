name: licontainer-build

on:
  push:
    branches: [main]
    paths:
      - "licontainer/**"
      - ".github/workflows/licontainer-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "licontainer/**"
      - ".github/workflows/licontainer-build.yml"

jobs:
  li-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout lic compiler (optional)
        uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
        continue-on-error: true

      - name: Build Li Container Engine packages
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: |
          if [[ -x "$LIC_ROOT/bin/lic" ]] || [[ -x "$LIC_ROOT/scripts/resolve-lic.sh" ]]; then
            export LIC="${LIC_ROOT}/bin/lic"
            if [[ ! -x "$LIC" ]]; then
              LIC="$("$LIC_ROOT/scripts/resolve-lic.sh")"
            fi
            chmod +x licontainer/scripts/build-li.sh
            licontainer/scripts/build-li.sh
          else
            echo "lic checkout unavailable — Li build skipped (add lic submodule or fork for CI)"
            exit 0
          fi

  rust-deprecated:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: licontainer
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Deprecated Rust build (reference only)
        run: cargo build --release
        continue-on-error: true

      - name: Deprecated Rust tests
        run: cargo test
        continue-on-error: true

name: licontainer-build

on:
  push:
    branches: [main]
    paths:
      - "licontainer/**"
      - ".github/workflows/licontainer-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "licontainer/**"
      - ".github/workflows/licontainer-build.yml"

jobs:
  li-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout lic compiler
        uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
        continue-on-error: true

      - name: Build pure Li licontainer packages
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: |
          if [[ -x "$LIC_ROOT/scripts/resolve-lic.sh" ]]; then
            chmod +x licontainer/scripts/build-li.sh
            licontainer/scripts/build-li.sh
          else
            echo "lic checkout unavailable — smoke .li syntax only"
            find licontainer/packages -name '*.li' | head -5
          fi

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-studio-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: data-studio-ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: "Install Python deps (KMS: cryptography; dual-backend: pytest)"
        working-directory: ${{ github.workspace }}
        run: pip install cryptography pytest psycopg2-binary

      - name: Python tests (lidb_engine dev runtime + admin-api + KMS)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          unit_files=()
          for f in tests/test_*.py; do
            case "$f" in
              tests/test_dual_backend.py) continue ;;
            esac
            unit_files+=("$f")
          done
          python -m unittest "${unit_files[@]}"
          python -m pytest tests/test_dual_backend.py

      - name: Unit tests
        run: npm test

      - name: SDK unit tests
        working-directory: ${{ github.workspace }}/packages/sdk
        run: npm test

      - name: MCP bridge tests
        working-directory: ${{ github.workspace }}/packages/mcp
        run: npm install --no-audit --no-fund && npm test

      - name: MCP dev harness tests
        working-directory: ${{ github.workspace }}/packages/mcp-dev-harness
        run: npm install --no-audit --no-fund && npm test

      - name: Todo app unit + E2E tests
        working-directory: ${{ github.workspace }}/apps/todo-app
        run: npm install --no-audit --no-fund && node test/unit.mjs && LIS_ROOT=${{ github.workspace }}/../lis node test/e2e.mjs

      - name: Coverage report
        run: npm run test:coverage -- --coverage.thresholds.lines=0
        continue-on-error: true

      - name: Build
        run: npm run build

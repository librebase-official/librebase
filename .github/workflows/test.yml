name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-studio-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: data-studio-ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Python deps (KMS: cryptography)
        working-directory: ${{ github.workspace }}
        run: pip install cryptography

      - name: Python tests (lidb_engine dev runtime + admin-api + KMS)
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Unit tests
        run: npm test

      - name: SDK unit tests
        working-directory: ${{ github.workspace }}/packages/sdk
        run: npm test

      - name: MCP unit + smoke tests
        working-directory: ${{ github.workspace }}/packages/mcp
        run: npm install --no-audit --no-fund && npm test

      - name: Todo app unit + E2E tests
        working-directory: ${{ github.workspace }}/apps/todo-app
        run: npm install --no-audit --no-fund && node test/unit.mjs && LIS_ROOT=${{ github.workspace }}/../lis node test/e2e.mjs

      - name: Coverage report
        run: npm run test:coverage -- --coverage.thresholds.lines=0
        continue-on-error: true

      - name: Build
        run: npm run build

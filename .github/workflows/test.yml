name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-studio-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: data-studio-ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Python tests (lidb_engine dev runtime)
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Unit tests
        run: npm test

      - name: Coverage report
        run: npm run test:coverage -- --coverage.thresholds.lines=0
        continue-on-error: true

      - name: Build
        run: npm run build

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-studio-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: data-studio-ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Python deps (KMS: cryptography)
        working-directory: ${{ github.workspace }}
        run: pip install cryptography

      - name: Python unit tests
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-python-unit.sh

      - name: Unit tests
        run: npm test

      - name: SDK unit tests
        working-directory: ${{ github.workspace }}/packages/sdk
        run: npm test

      - name: MCP unit + smoke tests
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-mcp-unit.sh

      - name: Todo app unit tests
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-todo-unit.sh

      - name: Coverage report
        run: npm run test:coverage -- --coverage.thresholds.lines=0
        continue-on-error: true

      - name: Build
        run: npm run build

  pentest:
    name: pentest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: In-process pentest
        run: bash scripts/ci-python-pentest.sh

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python e2e
        run: bash scripts/ci-python-e2e.sh

      - name: MCP e2e
        run: bash scripts/ci-mcp-e2e.sh

      - name: Todo app e2e
        run: bash scripts/ci-todo-e2e.sh

  staging-e2e:
    name: staging-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Staging HTTP e2e
        run: bash scripts/ci-staging-e2e.sh

  staging-security:
    name: staging-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Staging defensive security
        run: bash scripts/ci-staging-security.sh

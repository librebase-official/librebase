[package]
name = "lirun"
description = "OCI runtime for licontainer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "lirun"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["process", "signal", "mount", "sched", "user", "fs"] }
libc = "0.2"
libseccomp = "0.3"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

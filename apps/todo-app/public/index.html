<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Librebase Todo</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    main { max-width: 560px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
    p.sub { color: #94a3b8; margin: 0 0 1.5rem; font-size: 0.95rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.25rem; }
    .badge { display: inline-block; background: #334155; border-radius: 999px; padding: 0.15rem 0.6rem;
             font-size: 0.75rem; color: #cbd5e1; vertical-align: middle; }
    form.row { display: flex; gap: 0.5rem; }
    input[type="text"] { flex: 1; padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid #475569;
             background: #0f172a; color: #e2e8f0; font-size: 0.95rem; }
    button { padding: 0.6rem 1rem; border: none; border-radius: 8px; cursor: pointer;
             font-size: 0.9rem; font-weight: 600; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid #475569; color: #cbd5e1; }
    .btn-danger { background: transparent; border: 1px solid #7f1d1d; color: #fca5a5; }
    ul { list-style: none; padding: 0; margin: 1rem 0 0; }
    li { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0;
         border-bottom: 1px solid #334155; }
    li.done span { text-decoration: line-through; color: #64748b; }
    li span { flex: 1; }
    .empty { color: #64748b; text-align: center; padding: 1rem 0; font-size: 0.9rem; }
    .err { color: #fca5a5; font-size: 0.85rem; margin: 0.5rem 0; }
    .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .auth-tabs button { background: transparent; border: 1px solid #475569; color: #94a3b8; }
    .auth-tabs button.active { background: #334155; color: #e2e8f0; }
    .hidden { display: none !important; }
    label { display: block; font-size: 0.8rem; color: #94a3b8; margin: 0.5rem 0 0.25rem; }
    input[type="email"], input[type="password"] { width: 100%; padding: 0.6rem 0.8rem;
             border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; }
    .stack { display: grid; gap: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Librebase Todo <span class="badge">demo</span></h1>
    <p class="sub">A todo app running on <strong>@librebase/librebase</strong> — auth + CRUD on the lis stack.</p>

    <div id="auth-view" class="card">
      <div class="auth-tabs">
        <button id="tab-signin" class="active">Sign in</button>
        <button id="tab-signup">Create account</button>
      </div>
      <div class="stack">
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" />
        </div>
        <p class="err hidden" id="auth-err"></p>
        <button id="auth-submit" class="btn-primary">Sign in</button>
      </div>
    </div>

    <div id="todos-view" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <strong>Your todos</strong>
        <button id="signout" class="btn-ghost">Sign out</button>
      </div>
      <form class="row" id="new-todo-form">
        <input type="text" id="new-todo" placeholder="What needs doing?" autocomplete="off" />
        <button class="btn-primary" type="submit">Add</button>
      </form>
      <p class="err hidden" id="todo-err"></p>
      <ul id="todo-list"></ul>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let token = null;
    let mode = "signin";
    const authView = $("auth-view"), todosView = $("todos-view");
    const errBox = $("auth-err"), todoErr = $("todo-err");

    function showErr(box, msg) { box.textContent = msg; box.classList.remove("hidden"); }
    function clearErr(box) { box.classList.add("hidden"); box.textContent = ""; }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    async function api(path, opts = {}) {
      const headers = { "Content-Type": "application/json" };
      if (token) headers.Authorization = "Bearer " + token;
      const res = await fetch(path, Object.assign({}, opts, { headers }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.message || ("HTTP " + res.status));
      return data;
    }

    async function loadTodos() {
      const { todos } = await api("/todos");
      const list = $("todo-list");
      list.innerHTML = "";
      if (!todos.length) {
        list.innerHTML = '<li class="empty">No todos yet — add one above.</li>';
        return;
      }
      for (const t of todos) {
        const li = document.createElement("li");
        li.className = t.done ? "done" : "";
        const span = document.createElement("span");
        span.textContent = t.title || "";
        li.appendChild(span);
        if (!t.done) {
          const doneBtn = document.createElement("button");
          doneBtn.className = "btn-ghost";
          doneBtn.textContent = "Done";
          doneBtn.onclick = async () => {
            try { await api("/todos/" + t.id + "/complete", { method: "POST" }); loadTodos(); }
            catch (e) { showErr(todoErr, e.message); }
          };
          li.appendChild(doneBtn);
        }
        const delBtn = document.createElement("button");
        delBtn.className = "btn-danger";
        delBtn.textContent = "Delete";
        delBtn.onclick = async () => {
          try { await api("/todos/" + t.id, { method: "DELETE" }); loadTodos(); }
          catch (e) { showErr(todoErr, e.message); }
        };
        li.appendChild(delBtn);
        list.appendChild(li);
      }
    }

    function enterApp() {
      authView.classList.add("hidden");
      todosView.classList.remove("hidden");
      loadTodos();
    }

    $("tab-signin").onclick = () => {
      mode = "signin";
      $("tab-signin").classList.add("active");
      $("tab-signup").classList.remove("active");
      $("auth-submit").textContent = "Sign in";
    };
    $("tab-signup").onclick = () => {
      mode = "signup";
      $("tab-signup").classList.remove("active");
      $("tab-signup").classList.add("active");
      $("tab-signin").classList.remove("active");
      $("auth-submit").textContent = "Create account";
    };

    $("auth-submit").onclick = async () => {
      clearErr(errBox);
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) { showErr(errBox, "Email and password required"); return; }
      try {
        const path = mode === "signup" ? "/auth/signup" : "/auth/signin";
        const data = await api(path, { method: "POST", body: JSON.stringify({ email, password }) });
        token = data.access_token;
        if (!token) throw new Error("no session token returned");
        enterApp();
      } catch (e) {
        showErr(errBox, e.message);
      }
    };

    $("signout").onclick = () => {
      token = null;
      todosView.classList.add("hidden");
      authView.classList.remove("hidden");
    };

    $("new-todo-form").onsubmit = async (e) => {
      e.preventDefault();
      clearErr(todoErr);
      const title = $("new-todo").value.trim();
      if (!title) return;
      try {
        await api("/todos", { method: "POST", body: JSON.stringify({ title }) });
        $("new-todo").value = "";
        loadTodos();
      } catch (err) {
        showErr(todoErr, err.message);
      }
    };
  </script>
</body>
</html>

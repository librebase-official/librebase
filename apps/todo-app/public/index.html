<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Librebase Todo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23071014'/%3E%3Cpath d='M9 21l5-10 4 8 4-8 5 10' stroke='%232fd4c2' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --lb-ink: #071014;
      --lb-panel: #0e1a1c;
      --lb-panel-2: #122226;
      --lb-fog: #9bb0aa;
      --lb-paper: #e7f2ec;
      --lb-signal: #2fd4c2;
      --lb-signal-dim: #1fa89a;
      --lb-warn: #e8a838;
      --lb-danger: #ef4444;
      --lb-line: rgba(231, 242, 236, 0.12);
      --lb-line-strong: rgba(231, 242, 236, 0.22);
      --lb-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-display: "Orbitron", system-ui, sans-serif;
      --font-body: "Space Grotesk", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      background:
        radial-gradient(ellipse 90% 70% at 78% 12%, rgba(47, 212, 194, 0.12), transparent 55%),
        radial-gradient(ellipse 60% 55% at 10% 95%, rgba(232, 168, 56, 0.05), transparent 55%),
        linear-gradient(168deg, #0a1618 0%, var(--lb-ink) 46%, #050c0e 100%);
      background-attachment: fixed;
      color: var(--lb-paper);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(231, 242, 236, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(231, 242, 236, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 0%, #000 20%, transparent 78%);
    }

    /* ------------------------------------------------------------------ */
    /* Shell                                                              */
    /* ------------------------------------------------------------------ */
    .shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header.bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.1rem clamp(1.25rem, 4vw, 2.5rem);
      border-bottom: 1px solid var(--lb-line);
    }

    .wordmark {
      display: inline-flex;
      align-items: baseline;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      color: var(--lb-paper);
      text-decoration: none;
    }
    .wordmark span { color: var(--lb-signal); }
    .wordmark .slash { color: var(--lb-line-strong); margin: 0 0.5rem; font-weight: 500; }
    .wordmark .app {
      font-family: var(--font-body);
      font-weight: 500;
      letter-spacing: 0;
      font-size: 1rem;
      color: var(--lb-fog);
    }

    .bar-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--lb-fog);
      border: 1px solid var(--lb-line);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      white-space: nowrap;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: clamp(1.5rem, 5vw, 3rem) 1rem 4rem;
    }

    footer.foot {
      padding: 1.4rem clamp(1.25rem, 4vw, 2.5rem) 2rem;
      border-top: 1px solid var(--lb-line);
      text-align: center;
    }
    .foot p {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--lb-fog);
    }
    .foot a { color: var(--lb-signal); text-decoration: none; }
    .foot a:hover { text-decoration: underline; }

    /* ------------------------------------------------------------------ */
    /* Intro                                                              */
    /* ------------------------------------------------------------------ */
    .intro { margin-bottom: 1.5rem; }
    .kicker {
      margin: 0 0 0.5rem;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--lb-signal);
    }
    .intro h1 {
      margin: 0 0 0.4rem;
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--lb-paper);
    }
    .intro p.sub {
      margin: 0;
      color: var(--lb-fog);
      font-size: 0.98rem;
      line-height: 1.55;
      max-width: 34rem;
    }
    .intro p.sub strong { color: var(--lb-paper); font-weight: 600; }
    .intro p.sub code {
      font-family: var(--font-mono);
      font-size: 0.86em;
      color: var(--lb-signal);
      background: rgba(47, 212, 194, 0.08);
      border: 1px solid rgba(47, 212, 194, 0.2);
      border-radius: 5px;
      padding: 0.05rem 0.35rem;
    }

    /* ------------------------------------------------------------------ */
    /* Cards & form                                                       */
    /* ------------------------------------------------------------------ */
    .card {
      background: linear-gradient(180deg, rgba(18, 34, 38, 0.9), rgba(14, 26, 28, 0.9));
      border: 1px solid var(--lb-line);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 24px 60px -40px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
    }

    .badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--lb-signal);
      background: rgba(47, 212, 194, 0.1);
      border: 1px solid rgba(47, 212, 194, 0.25);
      border-radius: 999px;
      padding: 0.18rem 0.6rem;
    }

    .auth-tabs {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.25rem;
      width: 100%;
      padding: 0.25rem;
      margin-bottom: 1.25rem;
      background: rgba(7, 16, 20, 0.6);
      border: 1px solid var(--lb-line);
      border-radius: 10px;
    }
    .auth-tabs button {
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.55rem 0.75rem;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--lb-fog);
      cursor: pointer;
      transition: background 200ms var(--lb-ease), color 200ms var(--lb-ease), border-color 200ms var(--lb-ease);
    }
    .auth-tabs button:hover { color: var(--lb-paper); }
    .auth-tabs button.active {
      background: rgba(47, 212, 194, 0.12);
      border-color: rgba(47, 212, 194, 0.28);
      color: var(--lb-signal);
    }

    .stack { display: grid; gap: 0.9rem; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--lb-fog);
      margin-bottom: 0.35rem;
    }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--lb-line-strong);
      background: rgba(7, 16, 20, 0.7);
      color: var(--lb-paper);
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: border-color 200ms var(--lb-ease), box-shadow 200ms var(--lb-ease);
    }
    input::placeholder { color: rgba(155, 176, 170, 0.55); }
    input:focus {
      outline: none;
      border-color: var(--lb-signal);
      box-shadow: 0 0 0 3px rgba(47, 212, 194, 0.15);
    }

    .err {
      color: #f4b8b8;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      font-size: 0.85rem;
      margin: 0;
    }

    button { font-family: var(--font-body); }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid var(--lb-signal-dim);
      border-radius: 8px;
      background: var(--lb-signal);
      color: var(--lb-ink);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 200ms var(--lb-ease), transform 200ms var(--lb-ease);
    }
    .btn-primary:hover { background: #57dfcf; }
    .btn-primary:active { transform: translateY(1px); }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.45rem 0.85rem;
      border: 1px solid var(--lb-line-strong);
      border-radius: 7px;
      background: transparent;
      color: var(--lb-fog);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 200ms var(--lb-ease), color 200ms var(--lb-ease), background 200ms var(--lb-ease);
    }
    .btn-ghost:hover { border-color: var(--lb-signal-dim); color: var(--lb-signal); background: rgba(47, 212, 194, 0.06); }

    .btn-danger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.45rem 0.75rem;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: rgba(244, 184, 184, 0.8);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 200ms var(--lb-ease), color 200ms var(--lb-ease), background 200ms var(--lb-ease);
    }
    .btn-danger:hover { border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; background: rgba(239, 68, 68, 0.08); }

    /* ------------------------------------------------------------------ */
    /* Todos view                                                         */
    /* ------------------------------------------------------------------ */
    .todos-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .todos-head strong { font-size: 0.95rem; font-weight: 600; }
    .todos-head .count {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--lb-fog);
    }

    form.row { display: flex; gap: 0.5rem; }
    form.row input[type="text"] { flex: 1; }
    form.row .btn-primary { width: auto; padding: 0.65rem 1.1rem; }

    ul { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: 0.4rem; }
    li {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--lb-line);
      border-radius: 10px;
      background: rgba(7, 16, 20, 0.45);
      transition: border-color 200ms var(--lb-ease), background 200ms var(--lb-ease);
    }
    li:hover { border-color: var(--lb-line-strong); }
    li span { flex: 1; font-size: 0.95rem; word-break: break-word; }
    li.done { opacity: 0.55; }
    li.done span { text-decoration: line-through; color: var(--lb-fog); }

    li .check {
      flex: none;
      width: 20px;
      height: 20px;
      border: 1px solid var(--lb-line-strong);
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: transparent;
      transition: background 200ms var(--lb-ease), border-color 200ms var(--lb-ease), color 200ms var(--lb-ease);
    }
    li.done .check { background: var(--lb-signal); border-color: var(--lb-signal); color: var(--lb-ink); }

    .empty {
      color: var(--lb-fog);
      text-align: center;
      padding: 1.75rem 1rem;
      font-size: 0.9rem;
      border: 1px dashed var(--lb-line-strong);
      border-radius: 10px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="bar">
      <a class="wordmark" href="/" aria-label="Librebase home">Libre<span>base</span><span class="slash">/</span><span class="app">Todo</span></a>
      <span class="bar-tag">todo.librebase.xyz</span>
    </header>

    <main>
      <div class="intro">
        <p class="kicker">Reference app</p>
        <h1>Librebase Todo</h1>
        <p class="sub">A todo app running on <strong>@librebase/librebase</strong> — auth + CRUD on the lis stack.</p>
      </div>

      <div id="auth-view" class="card">
        <div class="auth-tabs">
          <button id="tab-signin" class="active">Sign in</button>
          <button id="tab-signup">Create account</button>
        </div>
        <div class="stack">
          <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <p class="err hidden" id="auth-err"></p>
          <button id="auth-submit" class="btn-primary">Sign in</button>
        </div>
      </div>

      <div id="todos-view" class="card hidden">
        <div class="todos-head">
          <strong>Your todos</strong>
          <button id="signout" class="btn-ghost">Sign out</button>
        </div>
        <form class="row" id="new-todo-form">
          <input type="text" id="new-todo" placeholder="What needs doing?" autocomplete="off" />
          <button class="btn-primary" type="submit">Add</button>
        </form>
        <p class="err hidden" id="todo-err"></p>
        <ul id="todo-list"></ul>
      </div>
    </main>

    <footer class="foot">
      <p>Librebase Todo · <a href="https://gitlab.lilangverse.xyz/librebase-official/librebase" rel="noopener">@librebase/librebase</a> · GPL-3.0</p>
    </footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let token = null;
    let mode = "signin";
    const authView = $("auth-view"), todosView = $("todos-view");
    const errBox = $("auth-err"), todoErr = $("todo-err");

    function showErr(box, msg) { box.textContent = msg; box.classList.remove("hidden"); }
    function clearErr(box) { box.classList.add("hidden"); box.textContent = ""; }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    async function api(path, opts = {}) {
      const headers = { "Content-Type": "application/json" };
      if (token) headers.Authorization = "Bearer " + token;
      const res = await fetch(path, Object.assign({}, opts, { headers }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.message || ("HTTP " + res.status));
      return data;
    }

    async function loadTodos() {
      const { todos } = await api("/todos");
      const list = $("todo-list");
      list.innerHTML = "";
      if (!todos.length) {
        list.innerHTML = '<li class="empty">No todos yet — add one above.</li>';
        return;
      }
      for (const t of todos) {
        const li = document.createElement("li");
        li.className = t.done ? "done" : "";

        const check = document.createElement("span");
        check.className = "check";
        check.innerHTML = "&#10003;";
        li.appendChild(check);

        const span = document.createElement("span");
        span.textContent = t.title || "";
        li.appendChild(span);

        if (!t.done) {
          const doneBtn = document.createElement("button");
          doneBtn.className = "btn-ghost";
          doneBtn.textContent = "Done";
          doneBtn.onclick = async () => {
            try { await api("/todos/" + t.id + "/complete", { method: "POST" }); loadTodos(); }
            catch (e) { showErr(todoErr, e.message); }
          };
          li.appendChild(doneBtn);
        }
        const delBtn = document.createElement("button");
        delBtn.className = "btn-danger";
        delBtn.textContent = "Delete";
        delBtn.onclick = async () => {
          try { await api("/todos/" + t.id, { method: "DELETE" }); loadTodos(); }
          catch (e) { showErr(todoErr, e.message); }
        };
        li.appendChild(delBtn);
        list.appendChild(li);
      }
    }

    function enterApp() {
      authView.classList.add("hidden");
      todosView.classList.remove("hidden");
      loadTodos();
    }

    $("tab-signin").onclick = () => {
      mode = "signin";
      $("tab-signin").classList.add("active");
      $("tab-signup").classList.remove("active");
      $("auth-submit").textContent = "Sign in";
      $("password").setAttribute("autocomplete", "current-password");
    };
    $("tab-signup").onclick = () => {
      mode = "signup";
      $("tab-signup").classList.remove("active");
      $("tab-signup").classList.add("active");
      $("tab-signin").classList.remove("active");
      $("auth-submit").textContent = "Create account";
      $("password").setAttribute("autocomplete", "new-password");
    };

    $("auth-submit").onclick = async () => {
      clearErr(errBox);
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) { showErr(errBox, "Email and password required"); return; }
      try {
        const path = mode === "signup" ? "/auth/signup" : "/auth/signin";
        const data = await api(path, { method: "POST", body: JSON.stringify({ email, password }) });
        token = data.access_token;
        if (!token) throw new Error("no session token returned");
        enterApp();
      } catch (e) {
        showErr(errBox, e.message);
      }
    };

    $("signout").onclick = () => {
      token = null;
      todosView.classList.add("hidden");
      authView.classList.remove("hidden");
    };

    $("new-todo-form").onsubmit = async (e) => {
      e.preventDefault();
      clearErr(todoErr);
      const title = $("new-todo").value.trim();
      if (!title) return;
      try {
        await api("/todos", { method: "POST", body: JSON.stringify({ title }) });
        $("new-todo").value = "";
        loadTodos();
      } catch (err) {
        showErr(todoErr, err.message);
      }
    };
  </script>
</body>
</html>

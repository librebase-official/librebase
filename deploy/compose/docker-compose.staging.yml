services:
  staging-admin:
    build:
      context: ../../admin-api
      dockerfile: Dockerfile
    container_name: librebase_staging_admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:54331:54330"
    env_file:
      - .env.staging
    environment:
      LIBREBASE_ADMIN_BIND: 0.0.0.0
      LIBREBASE_ADMIN_PORT: 54330
      LIBREBASE_ADMIN_DB_PATH: /data/admin.db
      LIBREBASE_KMS_URL: http://staging-kms:54340
    volumes:
      - librebase-staging-admin-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:54330/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - librebase-staging-net

  staging-kms:
    build:
      context: ../..
      dockerfile: kms/Dockerfile
    container_name: librebase_staging_kms
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      LIBREBASE_KMS_BIND: 0.0.0.0
      LIBREBASE_KMS_PORT: 54340
      LIBREBASE_KMS_DB_PATH: /data/kms.db
    volumes:
      - librebase-staging-kms-data:/data
    networks:
      - librebase-staging-net

  staging-web:
    build:
      context: ../../data-studio-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://stage.librebase.xyz
        LIBREBASE_VERSION: ${LIBREBASE_VERSION:-0.1.19}
    container_name: librebase_staging_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3007:3005"
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      PORT: 3005
      LIBREBASE_ADMIN_URL: http://staging-admin:54330
    depends_on:
      staging-admin:
        condition: service_healthy
    networks:
      - librebase-staging-net

networks:
  librebase-staging-net:

volumes:
  librebase-staging-admin-data:
  librebase-staging-kms-data:

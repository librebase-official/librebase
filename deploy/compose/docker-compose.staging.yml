services:
  db:
    image: postgres:16-alpine
    container_name: staging-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: stagingpass
      POSTGRES_DB: librebase
    volumes:
      - staging_db_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  admin-api:
    image: staging-admin-api
    container_name: staging-admin
    ports:
      - "54331:54330"
    environment:
      ADMIN_DB_HOST: db
      ADMIN_DB_PORT: "5432"
      ADMIN_DB_USER: postgres
      ADMIN_DB_PASS: stagingpass
      ADMIN_DB_NAME: librebase
      ADMIN_PORT: "54330"
      ADMIN_DASHBOARD_TOKEN: staging-dashboard-token
      LIBREBASE_GROK_CLIENT_ID: b1a00492-073a-47ea-816f-4c329264a828
      LIBREBASE_KMS_URL: http://kms:54340
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:54330/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  kms:
    image: staging-kms
    container_name: staging-kms
    environment:
      LIBREBASE_KMS_BIND: 0.0.0.0
      LIBREBASE_KMS_PORT: "54340"
      LIBREBASE_KMS_DB_PATH: /data/kms.db
    volumes:
      - staging_kms_data:/data

  studio:
    image: staging-studio
    container_name: staging-studio
    ports:
      - "3006:3005"
    environment:
      NODE_ENV: production
      PORT: "3005"
      LIBREBASE_ADMIN_URL: http://admin-api:54330
    depends_on:
      admin-api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: staging-nginx
    ports:
      - "3007:3007"
    volumes:
      - ./nginx-staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - studio

volumes:
  staging_db_data:
  staging_kms_data:

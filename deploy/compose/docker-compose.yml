services:
  kms:
    build:
      context: ../..
      dockerfile: kms/Dockerfile
    env_file:
      - .env
    environment:
      LIBREBASE_KMS_BIND: 0.0.0.0
      LIBREBASE_KMS_PORT: 54340
      LIBREBASE_KMS_DB_PATH: /data/kms.db
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:54340/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - librebase-kms-data:/data
    # Only Studio is published on host loopback; Admin (54330) and KMS (54340) stay inside this netns.
    ports:
      - "127.0.0.1:3005:3005"

  librebase-admin:
    build:
      context: ../..
      dockerfile: admin-api/Dockerfile
    network_mode: "service:kms"
    env_file:
      - .env
    environment:
      LIBREBASE_ADMIN_BIND: 0.0.0.0
      LIBREBASE_ADMIN_PORT: 54330
      LIBREBASE_ADMIN_DB_PATH: /data/admin.db
      LIBREBASE_KMS_URL: http://127.0.0.1:54340
      LIBREBASE_KMS_SERVICE_ROLE: ${LIBREBASE_KMS_SERVICE_ROLE}
      LIBREBASE_ADMIN_JWT_SECRET: ${LIBREBASE_ADMIN_JWT_SECRET}
    depends_on:
      kms:
        condition: service_healthy
    volumes:
      - librebase-admin-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:54330/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  studio:
    build:
      context: ../../data-studio-ui
      dockerfile: Dockerfile
      args:
        LIBREBASE_VERSION: ${LIBREBASE_VERSION}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:3005}
    network_mode: "service:kms"
    env_file:
      - .env
    environment:
      LIBREBASE_ADMIN_URL: http://127.0.0.1:54330
    depends_on:
      librebase-admin:
        condition: service_healthy

volumes:
  librebase-admin-data:
  librebase-kms-data:

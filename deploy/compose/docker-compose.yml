services:
  liorg:
    build:
      context: ../../liorg
      dockerfile: Dockerfile
    ports:
      - "54330:54330"
    environment:
      LIORG_SESSION_JWT_SECRET: ${LIORG_SESSION_JWT_SECRET:-dev-liorg-secret-change-me}
      LIORG_DB_PATH: /data/org.db
    volumes:
      - liorg-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:54330/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  studio:
    build:
      context: ../../data-studio-ui
      dockerfile: Dockerfile
    ports:
      - "54324:54324"
    environment:
      LIBREBASE_ORG_URL: http://liorg:54330
      LIBREBASE_ORG_SESSION: ${LIBREBASE_ORG_SESSION:-}
      LIBREBASE_ORG_ID: ${LIBREBASE_ORG_ID:-}
    depends_on:
      liorg:
        condition: service_healthy

volumes:
  liorg-data:
